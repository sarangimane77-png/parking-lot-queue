<!DOCTYPE html>
<html>
<head>
<title>Parking Lot</title>
<style>
body{text-align:center;font-family:Arial;background:#eee}
.box{background:white;padding:20px;margin:50px auto;width:500px}
.slot{display:inline-block;background:lightgreen;padding:20px;margin:10px}
.car{display:inline-block;background:skyblue;padding:15px;margin:5px}
</style>
</head>

<body>
<div class="box">
<h1>Parking Lot</h1>
<h3>Queue: FIFO</h3>

<div class="slot">Slot 1<br>Available</div>
<div class="slot">Slot 2<br>Occupied</div>
<div class="slot">Slot 3<br>Available</div>

<h2>Waiting Queue</h2>
<div class="car">Car 101</div> →
<div class="car">Car 102</div> →
<div class="car">Car 103</div>

</div>
</body>
</html>
